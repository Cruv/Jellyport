name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Superseded pull-request/main revisions cannot publish, so stop their checks.
# Manual full runs remain independent from automatic verification.
concurrency:
  group: jellyport-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/docs-scope.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - run: node scripts/check-docs.mjs
  unit:
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    outputs:
      build_artifact_id: ${{ steps.build_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Bind the build to this workflow run and revision
        run: node scripts/ci-runtime.mjs build-write dist
      - name: Preserve the immutable verified build
        id: build_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-build-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  browser:
    needs: [scope, unit]
    if: needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: iphone-portrait
            browser: webkit
          - project: iphone-landscape
            browser: webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the exact immutable build artifact ID
        env:
          CI_BUILD_ARTIFACT_ID: ${{ needs.unit.outputs.build_artifact_id }}
        run: node scripts/ci-runtime.mjs artifact-id
      - name: Restore this run's exact verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.unit.outputs.build_artifact_id }}
          path: dist/
          digest-mismatch: error
      - name: Verify the build belongs to this run and revision
        run: node scripts/ci-runtime.mjs build-verify dist
      - name: Install the profile's browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run every regression in this browser profile
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Preserve synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failures-${{ matrix.project }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Preserve the established required check name while joining all four profiles.
  test:
    needs: [scope, unit, browser]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Require complete scope, unit, build, audit and browser results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-runtime.mjs gate
      - name: Runtime checks passed
        if: needs.scope.outputs.docs_only != 'true'
        run: echo 'Complete runtime suite passed.'
      - name: Documentation-only checks passed
        if: needs.scope.outputs.docs_only == 'true'
        run: echo 'Documentation checks passed; no runtime validation or release requested.'

  docker:
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful scope and documentation checks
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Validate Compose examples
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          for compose_file in compose.yaml examples/compose.portainer.yaml examples/compose.shared-network.yaml examples/compose.snapshots.yaml examples/compose.plugin-backups.yaml; do
            docker compose -f "$compose_file" config --quiet
          done
      - run: docker build -t jellyport:ci .
        if: needs.scope.outputs.docs_only != 'true'
      - run: docker run -d --name jellyport-ci -p 127.0.0.1:8173:8000 -e JELLYPORT_DEMO=true jellyport:ci
        if: needs.scope.outputs.docs_only != 'true'
      - run: node scripts/smoke.mjs http://127.0.0.1:8173
        if: needs.scope.outputs.docs_only != 'true'
      - name: Smoke test guided first-run setup
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          docker run -d --name jellyport-fresh-ci -p 127.0.0.1:8175:8000 jellyport:ci
          node scripts/smoke-setup.mjs http://127.0.0.1:8175
      - name: Smoke test local setup with secure administrator cookies
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          docker run -d --name jellyport-secure-setup-ci -p 127.0.0.1:8176:8000 -e JELLYPORT_SECURE_COOKIE=true jellyport:ci
          node scripts/smoke-setup.mjs http://127.0.0.1:8176 --secure-cookie
      - name: Smoke test an unprivileged bind-mount deployment
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/jellyport-bind"
          sudo chown 1000:1000 "${RUNNER_TEMP}/jellyport-bind"
          sudo chmod 700 "${RUNNER_TEMP}/jellyport-bind"
          docker run -d --name jellyport-bind-ci --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --pids-limit 128 \
            -p 127.0.0.1:8174:8000 \
            -e TZ=Etc/UTC -e JELLYPORT_DEMO=true \
            -v "${RUNNER_TEMP}/jellyport-bind:/data" jellyport:ci
          node scripts/smoke.mjs http://127.0.0.1:8174
          docker exec jellyport-bind-ci node -e "const assert=require('node:assert/strict'),fs=require('node:fs'); assert.equal(process.getuid(),1000); assert.equal(process.getgid(),1000); for(const name of ['secret.key','jellyport.db']){const s=fs.statSync('/data/'+name); assert.equal(s.uid,1000); assert.equal(s.gid,1000); assert.equal(s.mode&0o777,0o600);} console.log('Bind-mount ownership and secret file permissions passed.');"
      - name: Runtime Docker checks passed
        if: needs.scope.outputs.docs_only != 'true'
        run: echo 'Complete Docker suite passed.'
      - name: Documentation-only checks passed
        if: needs.scope.outputs.docs_only == 'true'
        run: echo 'Documentation checks passed; no product image built.'
      - if: failure() && needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true'
        run: |
          docker logs jellyport-ci || true
          docker logs jellyport-bind-ci || true
          docker logs jellyport-fresh-ci || true
          docker logs jellyport-secure-setup-ci || true
      - if: always() && needs.scope.result == 'success' && needs.scope.outputs.docs_only != 'true'
        run: |
          docker stop jellyport-ci || true
          docker stop jellyport-bind-ci || true
          docker stop jellyport-fresh-ci || true
          docker stop jellyport-secure-setup-ci || true
