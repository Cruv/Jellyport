---
services:
  jellyport:
    image: ghcr.io/cruv/jellyport:latest
    build: .
    container_name: jellyport
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional one-time setup protection when upgrading an existing installation.
      - JELLYPORT_ADMIN_PASSWORD=${JELLYPORT_ADMIN_PASSWORD:-}
      - JELLYPORT_SECURE_COOKIE=${JELLYPORT_SECURE_COOKIE:-false}
      - JELLYPORT_DATA_DIR=/data
      - TZ=Etc/UTC
    volumes:
      - jellyport-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  jellyport-data:
