---
services:
  jellyport:
    image: ghcr.io/cruv/jellyport:latest
    container_name: jellyport
    user: "1000:1000" # Host UID:GID; prepare the data directory with this owner.
    environment:
      - JELLYPORT_ADMIN_PASSWORD=${JELLYPORT_ADMIN_PASSWORD:-}
      - JELLYPORT_DATA_DIR=/data
      - JELLYPORT_SECURE_COOKIE=false # Set true when accessing through HTTPS.
      - TZ=Etc/UTC # Optional; use your timezone.
    volumes:
      - "/path/to/jellyport:/data" # Application database and encryption key.
    ports:
      - "8000:8000"
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - media-network

networks:
  media-network:
    external: true
    # Use the existing network's actual Docker name, including any stack prefix.
    name: ${JELLYPORT_MEDIA_NETWORK:-media-network}
